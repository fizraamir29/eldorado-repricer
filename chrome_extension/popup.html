<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; padding: 15px; width: 300px; }
    input { width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box; }
    button { background: #4CAF50; color: white; padding: 10px; width: 100%; border: none; cursor: pointer; }
    button:hover { background: #45a049; }
    #status { margin-top: 10px; font-size: 12px; font-weight: bold; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h2>Repricer Bridge</h2>
  
  <label>Backend URL (e.g. http://159.223.120.133)</label>
  <input type="text" id="backend_url" placeholder="http://159.223.120.133">
  
  <label>Dashboard Auth Token</label>
  <input type="password" id="auth_token" placeholder="eyJhbG...">
  
  <button id="save_btn">Save & Connect</button>
  
  <div id="status"></div>

  <hr>
  <p style="font-size: 12px; color: #555;">Status: <span id="bg_status">Not Running</span></p>

  <script src="popup.js"></script>
</body>
</html>
